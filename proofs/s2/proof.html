<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S2 motion proof — Paper K-pop / Watercolor</title>
<style>
  @font-face { font-family: "Anton"; src: url("../../styles/paper-kpop/fonts/Anton-Regular.ttf"); font-display: block; }
  @font-face { font-family: "Archivo"; src: url("../../styles/paper-kpop/fonts/ArchivoBlack-Regular.ttf"); font-display: block; }
  @font-face { font-family: "DMMono"; src: url("../../styles/paper-kpop/fonts/DMMono-Regular.ttf"); font-display: block; }
  @font-face { font-family: "Marker"; src: url("../../styles/paper-kpop/fonts/PermanentMarker-Regular.ttf"); font-display: block; }
  @font-face { font-family: "Cormorant"; src: url("../../styles/watercolor-0.2.0/fonts/CormorantGaramond-Italic-Variable.ttf"); font-style: italic; font-weight: 300 700; font-display: block; }
  @font-face { font-family: "Cormorant"; src: url("../../styles/watercolor-0.2.0/fonts/CormorantGaramond-Variable.ttf"); font-style: normal; font-weight: 300 700; font-display: block; }
  @font-face { font-family: "Caveat"; src: url("../../styles/watercolor-0.2.0/fonts/Caveat-Variable.ttf"); font-weight: 400 700; font-display: block; }
  @font-face { font-family: "Plex"; src: url("../../styles/watercolor-0.2.0/fonts/IBMPlexMono-Regular.ttf"); font-display: block; }
  html, body { margin: 0; background: #1a1512; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, PW = 960, PH = 540;
const cv = document.getElementById("out");
const ctx = cv.getContext("2d", { alpha: false });
const PAPER = { paper: "#F2E8D5", ink: "#171310", red: "#E8452A", blue: "#203FD8", acid: "#D9F24B", accent: "#F5B93F" };
const WC = { paper: "#F3EAD9", ink: "#2F2A24", wash: "#9FB7A4", petal: "#D9A6A0", accent: "#C65438", deep: "#8FA79A" };

function font(weight, size, family, italic) {
  return `${italic ? "italic " : ""}${weight} ${size}px "${family}"`;
}
function text(s, x, y, size, family, color, align = "left", weight = 400, stroke, lineWidth = 0, shadow = null, italic = false) {
  ctx.save();
  ctx.font = font(weight, size, family, italic);
  ctx.textAlign = align;
  ctx.textBaseline = "alphabetic";
  if (shadow) {
    ctx.shadowColor = shadow;
    ctx.shadowOffsetX = Math.max(2, size * 0.06);
    ctx.shadowOffsetY = Math.max(2, size * 0.07);
    ctx.shadowBlur = 0;
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.lineJoin = "round";
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function paperBase() {
  ctx.fillStyle = PAPER.paper;
  ctx.fillRect(0, 0, PW, PH);
}
function waterBase() {
  ctx.fillStyle = WC.paper;
  ctx.fillRect(0, 0, PW, PH);
}
function halftone(color, alpha = 0.16, step = 18) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  for (let y = 0; y < PH; y += step) {
    for (let x = (y / step) % 2 === 0 ? 0 : step / 2; x < PW; x += step) {
      ctx.beginPath();
      ctx.arc(x, y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}
function tornStrip(x, y, w, h, color, rot = 0) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  const n = 18;
  ctx.moveTo(-w / 2, -h / 2);
  for (let i = 0; i <= n; i++) ctx.lineTo(-w / 2 + (w * i) / n, -h / 2 + ((i * 7) % 5) - 2);
  ctx.lineTo(w / 2, h / 2);
  for (let i = n; i >= 0; i--) ctx.lineTo(-w / 2 + (w * i) / n, h / 2 + ((i * 5) % 7) - 3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function sunburst(cx, cy, r, color, petals, rot) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  for (let i = 0; i < petals; i++) {
    const a = (i / petals) * Math.PI * 2;
    const len = r * (0.86 + (i % 3) * 0.06);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a - 0.11) * len, Math.sin(a - 0.11) * len);
    ctx.lineTo(Math.cos(a + 0.11) * len, Math.sin(a + 0.11) * len);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}
function figure(x, y, s, body, accent, flip = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip * s, s);
  ctx.fillStyle = PAPER.ink;
  ctx.beginPath();
  ctx.arc(0, -92, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = PAPER.paper;
  ctx.beginPath();
  ctx.arc(-8, -99, 2.2, 0, Math.PI * 2);
  ctx.arc(8, -99, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-22, -64);
  ctx.lineTo(22, -64);
  ctx.lineTo(30, 18);
  ctx.lineTo(-30, 18);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = accent;
  ctx.fillRect(-30, 18, 60, 8);
  ctx.strokeStyle = PAPER.ink;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-18, -52); ctx.lineTo(-48, -12); ctx.lineTo(-40, 26);
  ctx.moveTo(18, -52); ctx.lineTo(48, -12); ctx.lineTo(40, 26);
  ctx.stroke();
  ctx.fillStyle = PAPER.paper;
  ctx.beginPath(); ctx.arc(-18, -52, 5, 0, Math.PI * 2); ctx.arc(18, -52, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function leaf(x, y, rx, ry, rot, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function seal(x, y, s, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.07);
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, s, s * 0.92);
  ctx.strokeStyle = WC.paper;
  ctx.lineWidth = Math.max(1, s * 0.035);
  ctx.setLineDash([s * 0.25, s * 0.09]);
  for (let i = 1; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(s * 0.14, (s * 0.92 * i) / 5);
    ctx.lineTo(s * 0.86, (s * 0.92 * i) / 5);
    ctx.stroke();
  }
  ctx.restore();
}
function paperOpen(local, t) {
  paperBase();
  const open = Math.min(1, local / 1.2);
  const scale = 0.82 + 0.18 * open;
  ctx.save();
  ctx.translate(PW / 2, 248);
  ctx.scale(scale, scale);
  sunburst(0, 0, 205, PAPER.acid, 26, t * 0.12);
  ctx.fillStyle = PAPER.accent;
  ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  halftone(PAPER.ink, 0.1, 20);
  text("PAPER", PW / 2, 250, 96, "Anton", PAPER.ink, "center", 400, PAPER.paper, 10, PAPER.ink);
  text("STAGE", PW / 2, 336, 96, "Anton", PAPER.ink, "center", 400, PAPER.paper, 10, PAPER.ink);
  text("A CUT-PAPER PERFORMANCE", PW / 2, 382, 18, "DMMono", PAPER.ink, "center");
  ctx.strokeStyle = PAPER.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(300, 404); ctx.lineTo(660, 404); ctx.stroke();
}
function paperTitle(local) {
  paperBase();
  const card = Math.min(1, local / 0.8);
  ctx.save();
  ctx.translate(0, (1 - card) * -30);
  ctx.fillStyle = PAPER.red;
  ctx.fillRect(56, 44, PW - 112, PH - 88);
  ctx.strokeStyle = PAPER.ink; ctx.lineWidth = 3;
  ctx.strokeRect(56, 44, PW - 112, PH - 88);
  ctx.restore();
  const drop = Math.min(1, Math.max(0, (local - 0.35) / 1.2));
  ctx.save();
  ctx.globalAlpha = drop;
  text("PAPER STAGE", 96, 186 - (1 - drop) * 40, 72, "Anton", PAPER.paper, "left", 400, PAPER.ink, 4, PAPER.ink);
  text("THE FLOOR IS YOURS", 96, 300 - (1 - drop) * 30, 38, "Archivo", PAPER.paper, "left", 400, PAPER.ink, 3, PAPER.ink);
  ctx.restore();
  ctx.fillStyle = PAPER.acid; ctx.fillRect(96, 336, 200, 7);
  halftone(PAPER.ink, 0.18, 16);
}
function paperStage(local, t) {
  paperBase();
  ctx.fillStyle = PAPER.blue; ctx.fillRect(0, 300, PW, 240);
  ctx.fillStyle = "rgba(242,232,213,0.14)"; ctx.fillRect(0, 300, PW, 6);
  const sway = Math.sin(t * 1.2) * 4;
  sunburst(PW / 2, 210, 190, PAPER.acid, 24, -t * 0.1);
  figure(390 + sway, 470, 1.05, PAPER.red, PAPER.paper, 1);
  figure(570 - sway, 470, 1.05, PAPER.blue, PAPER.acid, -1);
  ctx.fillStyle = PAPER.ink;
  ctx.fillRect(PW - 210, 26, 180, 40);
  text("88 · 34%", PW - 120, 52, 15, "DMMono", PAPER.acid, "center");
  ctx.fillStyle = PAPER.paper;
  ctx.fillRect(64, 398, 470, 62);
  text("ONE TAKE. NO RETAKES.", 82, 428, 24, "Archivo", PAPER.ink);
  text("THE FLOOR IS YOURS", 82, 454, 18, "DMMono", PAPER.ink);
  halftone(PAPER.ink, 0.14, 18);
}
function paper(t) {
  if (t < 5) paperOpen(t, t);
  else if (t < 10) paperTitle(t - 5);
  else paperStage(t - 10, t);
  ctx.fillStyle = "rgba(23,19,16,0.08)";
  ctx.fillRect(0, 0, PW, 6);
}
function washPath(points, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function arch(x, y, w, h, reveal) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, reveal, PH);
  ctx.clip();
  ctx.fillStyle = WC.wash;
  ctx.globalAlpha = 0.22;
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.lineTo(x, y + w * 0.5);
  ctx.quadraticCurveTo(x, y, x + w / 2, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + w * 0.5);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = WC.paper;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.12, y + h);
  ctx.lineTo(x + w * 0.12, y + w * 0.55);
  ctx.quadraticCurveTo(x + w * 0.12, y + h * 0.08, x + w / 2, y + h * 0.08);
  ctx.quadraticCurveTo(x + w * 0.88, y + h * 0.08, x + w * 0.88, y + w * 0.55);
  ctx.lineTo(x + w * 0.88, y + h);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function branch(x, y, s, color, alpha = 0.8) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.strokeStyle = WC.ink;
  ctx.lineWidth = 4;
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(0, 180);
  ctx.bezierCurveTo(-10, 100, 20, 30, 58, -30);
  ctx.stroke();
  ctx.globalAlpha = alpha;
  leaf(38, 68, 34, 13, -0.5, color, 0.8);
  leaf(22, 108, 38, 13, -0.35, color, 0.7);
  leaf(48, 34, 30, 11, 0.35, color, 0.7);
  leaf(18, 30, 26, 10, -0.6, WC.petal, 0.7);
  ctx.restore();
}
function waterTitle(local, t) {
  waterBase();
  const reveal = Math.min(1, local / 1.8) * PW;
  washPath([[0, 340], [180, 320], [360, 355], [540, 330], [720, 360], [960, 335], [960, 540], [0, 540]], WC.wash, 0.18);
  washPath([[0, 360], [200, 338], [380, 372], [560, 348], [740, 378], [960, 352], [960, 540], [0, 540]], WC.wash, 0.14);
  arch(540, 100, 300, 330, reveal);
  branch(640, 160, 0.72, WC.wash, 0.75);
  seal(800, 46, 46, WC.accent);
  text("The Garden", 54, 150, 52, "Cormorant", WC.ink, "left", 500, null, 0, null, true);
  text("We Borrowed", 54, 202, 52, "Cormorant", WC.ink, "left", 500, null, 0, null, true);
  text("A wedding invitation painted from the day", 54, 238, 16, "Cormorant", WC.ink);
  text("Mira & Jonah", 54, 282, 22, "Cormorant", WC.ink);
  text("21 JUNE", 54, 470, 12, "Plex", WC.ink);
  text("THE GLASSHOUSE AT FIELD 9", 54, 488, 12, "Plex", WC.ink);
  ctx.strokeStyle = WC.ink; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(54, 258); ctx.lineTo(300, 258); ctx.stroke();
  ctx.globalAlpha = 1;
}
function waterWalk(local, t) {
  waterBase();
  const pan = -40 + (local / 5) * 80;
  ctx.save();
  ctx.translate(pan, 0);
  washPath([[-120, 260], [160, 240], [420, 278], [700, 250], [980, 282], [1080, 282], [1080, 420], [-120, 420]], WC.wash, 0.18);
  washPath([[-120, 300], [180, 280], [440, 318], [720, 292], [1000, 322], [1080, 322], [1080, 440], [-120, 440]], WC.wash, 0.12);
  branch(150, 210, 0.9, WC.wash, 0.75);
  branch(600, 190, 0.85, WC.wash, 0.65);
  branch(900, 220, 0.9, WC.wash, 0.75);
  ctx.strokeStyle = WC.ink; ctx.lineWidth = 1; ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.moveTo(-120, 450); ctx.bezierCurveTo(220, 430, 620, 430, 1080, 450); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
  text("the paint stops short here", 54, 474, 26, "Caveat", WC.ink, "left", 500, WC.paper, 10);
  ctx.strokeStyle = WC.ink; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(80, 448); ctx.lineTo(300, 380); ctx.stroke();
  ctx.globalAlpha = 1;
}
function waterClose(local, t) {
  waterBase();
  const reveal = Math.min(1, local / 1.8) * PW;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, reveal, PH); ctx.clip();
  washPath([[480, 250], [700, 230], [900, 270], [960, 280], [960, 430], [480, 430]], WC.wash, 0.2);
  branch(610, 150, 1.0, WC.wash, 0.75);
  ctx.fillStyle = WC.paper;
  ctx.fillRect(872, 140, 18, 270);
  ctx.restore();
  seal(70, 86, 46, WC.accent);
  text("M & J", 70, 168, 26, "Cormorant", WC.ink, "left", 500);
  text("the paint stops short here", 54, 360, 28, "Caveat", WC.ink, "left", 500, WC.paper, 10);
  text("21 JUNE", 54, 430, 12, "Plex", WC.ink);
  ctx.strokeStyle = WC.ink; ctx.globalAlpha = 0.45; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(54, 390); ctx.lineTo(480, 390); ctx.stroke();
  ctx.globalAlpha = 1;
}
function watercolor(t) {
  if (t < 5) waterTitle(t, t);
  else if (t < 10) waterWalk(t - 5, t);
  else waterClose(t - 10, t);
  ctx.fillStyle = "rgba(47,42,36,0.06)";
  ctx.fillRect(0, 0, PW, 6);
}
function label(title, sub, x, y) {
  ctx.save();
  ctx.fillStyle = "rgba(14,11,9,0.72)";
  ctx.fillRect(x + 14, y + 14, 330, 52);
  text(title, x + 28, y + 42, 18, "Plex", "#F3EAD9", "left", 400);
  text(sub, x + 28, y + 60, 10, "Plex", "#F3EAD9", "left", 400);
  ctx.restore();
}
function drawAt(t) {
  ctx.fillStyle = "#1a1512";
  ctx.fillRect(0, 0, W, H);
  const OY = (H - PH) / 2;
  ctx.save();
  ctx.translate(0, OY);
  ctx.beginPath(); ctx.rect(0, 0, PW, PH); ctx.clip();
  paper(t);
  ctx.restore();
  ctx.save();
  ctx.translate(PW, OY);
  ctx.beginPath(); ctx.rect(0, 0, PW, PH); ctx.clip();
  watercolor(t);
  ctx.restore();
  ctx.fillStyle = "#1a1512";
  ctx.fillRect(PW - 2, OY, 4, PH);
  label("PAPER K-POP", "0.1.0 · open / title / stage", 0, OY);
  label("WATERCOLOR", "0.2.0 · title / walk / close", PW, OY);
  text("S2 MOTION PROOF", W / 2, 104, 46, "Cormorant", "#F3EAD9", "center", 500, null, 0, null, true);
  text("15 s · 3 shots per style · authored pack tokens, not a plan render", W / 2, 144, 14, "Plex", "#CDBFA8", "center");
  text("Paper K-pop 0.1.0 / Watercolor 0.2.0 · 2026-10-28", W / 2, 1016, 13, "Plex", "#8E7F6D", "center");
}
window.renderAt = (t) => { drawAt(Number(t)); return true; };
window.ready = false;
(async () => {
  await document.fonts.ready;
  window.ready = true;
  drawAt(0);
})();
</script>
</body>
</html>
